# @momojie-s/dsh-workspace-mcp bundle patch layer: applied when listed in the profile bundles.
# The line name is the package name (not a file:// URL), resolved by Node to the installed package.
- insert:
    - id: workspace-mcp
      name: '@momojie-s/dsh-workspace-mcp'
      config:
        configFile: '.dsh/mcp.servers.yml'   # default, written out so it is easy to override
